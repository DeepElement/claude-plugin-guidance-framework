# Reference implementation of the semantic-commit-conventions skill:
# every PR title must follow Conventional Commits format, since main
# PRs are squash-merged and the title becomes the actual commit
# message on the target branch. This repo has no staging/release
# branches (not independently deployed), so only main is covered.

name: Lint PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR title follows Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: .+'
          if ! echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title does not follow Conventional Commits format (see .claude/skills/semantic-commit-conventions). Expected: <type>(<scope>)!: <description>, type one of feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert."
            exit 1
          fi
          echo "PR title follows Conventional Commits format."
